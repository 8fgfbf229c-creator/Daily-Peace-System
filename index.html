<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Reset is a private daily peace system: a mood check-in, a 5-step calm flow, Night Reset, guided meditations, gratitude, and a journal that stays on your device." />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#F3EFE6" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Reset" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Reset – Your Daily Peace System</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <script>
    (function () {
      try {
        var mode = 'auto';
        var raw = localStorage.getItem('reset_settings_v1');
        if (raw) {
          var saved = JSON.parse(raw);
          if (saved && (saved.theme === 'light' || saved.theme === 'dark' || saved.theme === 'auto')) mode = saved.theme;
        }
        var theme = mode;
        if (mode === 'auto') {
          var hour = new Date().getHours();
          theme = (hour >= 20 || hour < 6) ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#12131A' : '#F3EFE6');
      } catch (error) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
